[package]
name = "edge-bridge"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "edge_bridge"
crate-type = ["staticlib", "rlib"]

[dependencies]
qdrant-edge = "=0.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "unwind"
strip = "symbols"
